[tool.poetry]
name = "sparrow_cli"
version = "4.0.0"
description = ""
authors = ["Daven Quinn <dev@davenquinn.com>"]
packages = [
  {include= "sparrow_cli"},
]

[tool.poetry.dependencies]
python = "^3.8"

click = "^8.0.1"
rich = "*"
envbash = "^1.2.0"
pytest = "^8.3.2"
pyyaml = "^6.0.1"
pydantic = "^1.9.0"
docker = "^7.1.0"

click-default-group = "^1.2.2"
keepachangelog = "2.0.0.dev2"
packaging = "^24.1"

# Utility functions (we would move this to a separate folder, ideally)
"macrostrat.utils" = "^1.2.1"

# Database backup and schema migration functionality
#"macrostrat.dinosaur" = "^3.1.0"
"macrostrat.database" = "^3.3.1"
"macrostrat.dinosaur" = {  path = "/Users/Daven/Projects/Macrostrat/Software/python-libraries/dinosaur", develop = true }
"macrostrat.app_frame" = {  path = "/Users/Daven/Projects/Macrostrat/Software/python-libraries/app-frame", develop = true }

chardet = "^5.1.0"
charset-normalizer = "2.1.0"


[tool.poetry.scripts]
sparrow = "sparrow_cli:cli"

[tool.black]
line-length = 88
skip-magic-trailing-comma = true
target-version = ['py38']
