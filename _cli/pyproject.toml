[tool.poetry]
name = "sparrow_cli"
version = "4.0.0"
description = ""
authors = ["Daven Quinn <dev@davenquinn.com>"]
packages = [
  {include= "sparrow_cli"},
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

click = "^8.0.1"
rich = "*"
envbash = "*"
pytest = "*"
pyyaml = "^6.0.1"
pydantic = "^1.9.0"
docker = "^7.0.0"
requests = "^2.32.0"
setuptools = "^81.0.0"

click-default-group = "^1.2.2"
keepachangelog = "2.0.0.dev2"
packaging = "^23.2"

# Shared Macrostrat libraries
"macrostrat.utils" = "^1.3.3"
# Database cluster upgrades
"macrostrat.dinosaur" = "^4.3.0"
"macrostrat.database" = "^4.7.0"
# sqlalchemy-utils (via macrostrat.database) does not import under SQLAlchemy 2.1
SQLAlchemy = ">=2.0.36,<2.1"
chardet = "^5.1.0"
charset-normalizer = "2.1.0"


[tool.poetry.scripts]
sparrow = "sparrow_cli:cli"

[tool.black]
line-length = 88
skip-magic-trailing-comma = true
target-version = ['py312']
