[tool.poetry]
name = "sparrow-cli"
version = "4.0.0"
description = "Command-line interface for Sparrow labs and pipelines"
authors = ["Daven Quinn <dev@davenquinn.com>"]
packages = [
  {include= "sparrow_cli"},
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

click = "^8.0.1"
click-default-group = "^1.2.2"
rich = ">=13.7.1"
envbash = "*"
pyyaml = "^6.0.1"
pydantic = "^2.9.0"
packaging = "^24.1"

# Shared Macrostrat libraries
"macrostrat.utils" = "^1.3.3"
"macrostrat.app_frame" = "^3.2.1"

# Pipelines, which run without a server
"sparrow.pipelines" = {path = "../backend/pipelines", develop = true}

# Managing a Sparrow server on this machine
docker = {version = "^7.0.0", optional = true}

[tool.poetry.extras]
server = ["docker"]

[tool.poetry.group.dev.dependencies]
pytest = "*"

[tool.poetry.scripts]
sparrow = "sparrow_cli:cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
