[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["__archive*", "_disabled_tests", "deps", "node_modules"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["sparrow", "sparrow_cli", "sparrow_worker", "core_plugins"]
split-on-trailing-comma = false

[tool.pylint.messages_control]

max-line-length = 88

disable = [
  "missing-docstring",
  "missing-class-docstring",
  "too-few-public-methods",
  "logging-fstring-interpolation"
]