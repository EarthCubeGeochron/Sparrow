# Modifies containers for dev hot reloading
services:
  gateway:
    volumes:
      - ./nginx-config/locations/frontend-development.conf:/etc/nginx/locations/frontend.conf:ro
  frontend:
    build:
      context: frontend
      target: base
    # The full frontend directory is bind-mounted below, so any dependencies installed into the image are hidden at runtime.
    # Ensure Yarn's PnP install state exists in the mounted /app before starting Vite.
    command: sh -lc "yarn install --immutable && yarn run dev:docker"
    expose:
      - 3000
    volumes:
      # Extra bind mounts to local directories for code reloading
      # - ./frontend/src:/app/src
      # - ./frontend/packages:/app/packages
      # - ./frontend/plugins:/app/plugins
      # - ./frontend/static:/app/static
      # - ./frontend/package.json:/app/package.json:ro
      # - ./frontend/yarn.lock:/app/yarn.lock:ro
      # # Keep node_modules in a volume to speed up rebuilding
      # - frontend_yarn_cache:/app/.yarn/cache
      - ./frontend:/app
volumes:
  frontend_yarn_cache:
