[tool.poetry]
name = "sparrow-loader"
version = "1.1.0"
description = "Utilities for loading data into Sparrow"
authors = ["Daven Quinn <dev@davenquinn.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "sparrow"}]
include = ["sparrow/loader/sparrow-db-models.pickle"]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
marshmallow = "^3.20.1"
marshmallow-sqlalchemy = "^0.29.0"
marshmallow-jsonschema = "^0.13.0"
GeoAlchemy2 = ">=0.15.2,<0.21.0"
SQLAlchemy = ">=2.0.36,<2.1"
"macrostrat.database" = "^4.7.0"
stringcase = "^1.2.0"
shapely = "^2"
typer = ">=0.12.5"
rich = "^13.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

# Command-line scripts
[tool.poetry.scripts]
sparrow-loader = "sparrow.loader.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
