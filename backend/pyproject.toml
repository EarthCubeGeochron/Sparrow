[tool.poetry]
name = "sparrow"
version = "0.1.0"
description = ""
authors = ["Daven Quinn <dev@davenquinn.com>"]
packages = [
  {include= "sparrow"},
  {include = "core_plugins"},
  {include = "sparrow_worker"},
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# Database
psycopg2 = "^2.9.11"
"macrostrat.database" = "^4.7.0"
"macrostrat.utils" = "^1.3.3"
"macrostrat.schema_management" = "^2.0.1"
# sqlalchemy-utils (via macrostrat.database) does not import under SQLAlchemy 2.1
SQLAlchemy = ">=2.0.36,<2.1"
GeoAlchemy2 = ">=0.15.2,<0.21.0"
sqlalchemy-utils = "^0.41.2"
shapely = "^2.0.6"

# Loading records
"sparrow.loader" = {path = "./loader", develop = true }
"sparrow.pipelines" = {path = "./pipelines", develop = true }
marshmallow = "^3.20.1"
marshmallow-sqlalchemy = "^0.29.0"
marshmallow-jsonschema = "^0.13.0"
stringcase = "1.2.0"
pydantic = "^2.9.0"

# Web service
starlette = "^0.31.1"
Hypercorn = "^0.17.0"
aiofiles = ">=23.2.1"
PyJWT = "1.7.1"
werkzeug = "^2.3.7"

# Object storage
boto3 = "^1.35.0"

# Plugins and commands
toposort = "^1.10"
click = "^8.1.0"
typer = ">=0.12.5"
rich = "^13.7.1"
requests = "^2.32.0"

# Task worker
celery = "^5.4.0"
redis = "^5.0.0"
broadcaster = { version = "^0.3.1", extras = [ "redis" ] }
# For worker auto-reloading in development
watchdog = "^4.0.0"

setuptools = "^81.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-order = "^1.3.0"
deepdiff = "^8.0.0"
httpx = "^0.27.0"
ruff = ">=0.16"
docker = "^7.0.0"
moto = {version = "^5.0.0", extras = ["s3"]}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--pdbcls=IPython.terminal.debugger:Pdb --durations 10 --color=yes" # --capture=no --show-capture=no"
# Also run tests that are imported from core sparrow code

# This cache setup works for docker but may not work outside of it...
cache_dir = "/tmp/sparrow-pytest-cache"
markers = { slow = "Slow test that is usually ignored" }

#log_cli = true
#log_cli_level = "INFO"

filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning"
]

testpaths = [
  "sparrow"
]
